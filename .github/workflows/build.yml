name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: ${{ matrix.arch }}

    - name: Create Build Directory
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      run: cmake .. -A ${{ matrix.arch=='x64' && 'x64' || 'Win32' }}

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Release

    - name: Package
      run: |
        mkdir publish
        cp build/Release/ShakeToFindCursor.exe "publish/ShakeToFindCursor-${{ matrix.arch }}.exe" || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ShakeToFindCursor-${{ matrix.arch }}
        path: publish/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Extract Tag Message as Release Body
      id: tag_info
      shell: bash
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        BODY=$(git tag -l --format='%(contents)' "$TAG_NAME")
        if [ -z "$BODY" ]; then
          BODY=$(git log -1 --format=%B)
        fi
        SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG_NAME")
        if [ -z "$SUBJECT" ]; then
          SUBJECT="$TAG_NAME"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
        {
          echo "body<<EOF"
          echo "$BODY"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag_info.outputs.tag_name }}
        name: ${{ steps.tag_info.outputs.subject }}
        body: ${{ steps.tag_info.outputs.body }}
        files: artifacts/*.exe
        draft: false
        prerelease: false
