name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # The detection algorithm has no Windows dependency, so its regression suite
  # runs on Linux in a couple of seconds.
  detector-tests:
    name: Shake detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSTFC_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --target shake_detector_tests
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (MSVC)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check the manifest really is embedded
        shell: pwsh
        run: |
          $exe = "build/Release/ShakeToFindCursor.exe"
          Get-Item $exe | Select-Object Name, Length
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('PerMonitorV2')) {
            throw "the embedded manifest does not declare PerMonitorV2"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $arch = "${{ matrix.arch }}".ToLower()
          Copy-Item build/Release/ShakeToFindCursor.exe "publish/ShakeToFindCursor-$arch.exe"
          Get-ChildItem publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeToFindCursor-${{ matrix.arch }}
          path: publish/*

  release:
    name: GitHub release
    needs: [windows, detector-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
