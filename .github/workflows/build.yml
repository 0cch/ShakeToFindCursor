name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: ${{ matrix.arch }}

    - name: Create Build Directory
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      run: cmake .. -A ${{ matrix.arch=='x64' && 'x64' || 'Win32' }}

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Release

    - name: Package
      run: |
        mkdir publish
        cp build/Release/ShakeToFindCursor.exe "publish/ShakeToFindCursor-${{ matrix.arch }}.exe" || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ShakeToFindCursor-${{ matrix.arch }}
        path: publish/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: latest
        name: "Latest Build (HD Custom Cursors)"
        body: "Automated build of ShakeToFindCursor with high-res cursor detection."
        files: artifacts/*.exe
        draft: false
        prerelease: false
